services:
  copilote:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      # Le mot de passe se propage depuis POSTGRES_PASSWORD (≠ 'copilote' en prod).
      - DATABASE_URL=postgresql://copilote:${POSTGRES_PASSWORD:-copilote}@postgres:5432/copilote
      - REDIS_URL=redis://redis:6379/0
      # Seul le service `copilote` applique les migrations au boot (entrypoint) ;
      # le worker partage le même entrypoint mais ne doit pas migrer en parallèle.
      - RUN_MIGRATIONS_ON_BOOT=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      # Seul `copilote` migre + provisionne le mot de passe de `app_runtime` (S182) ; démarrer le
      # worker après lui réduit la fenêtre où une tâche se connecterait avant le provisioning. Les
      # pools worker sont créés à la tâche (pas au boot) et Celery réessaie → fenêtre résiduelle bénigne.
      copilote:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: copilote
      POSTGRES_USER: copilote
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilote}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilote -d copilote"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.9.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
