[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    e2e: tests end-to-end Playwright (nécessite Vite :5173 + npm run dev)
    evals: tests golden dataset — appels Claude RÉELS, exclus de la CI standard
    integration: tests nécessitant une vraie DB ou Redis
