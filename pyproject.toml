[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N"]
ignore = [
    "N806",  # variable en minuscule dans une fonction — noms métier FR acceptés
    "N803",  # argument en minuscule — noms métier FR acceptés
    "N802",  # nom de fonction en minuscule — noms métier FR acceptés
    "N815",  # mixedCase — noms métier FR acceptés
    "N812",  # alias minuscule — noms métier FR acceptés
    "E501",  # ligne trop longue — déjà couvert par line-length
    "E402",  # import pas en tête — imports conditionnels intentionnels (évite les cycles)
    "E702",  # plusieurs instructions sur une ligne — style existant
    "E741",  # noms de variables ambigus — variables mathématiques courtes (l, O, I)
    "F821",  # nom indéfini — faux positif sur imports lazy dans fonctions
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F841", "F811", "E501"]
"tests/evals/**/*.py" = ["F841", "F811", "E501", "N"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
plugins = ["pydantic.mypy"]
# Faux positifs avec Pydantic v2 @computed_field et pattern SkillBase générique
disable_error_code = ["override", "prop-decorator"]

# Modules avec erreurs de typage pré-existantes — à corriger progressivement
[[tool.mypy.overrides]]
module = [
    "app.services.email_service",
    "app.services.backtest",
    "app.services.evals_dashboard",
    "app.skills.tier1.yahoo_finance",
    "app.api.endpoints.telemetry",
    "app.api.endpoints.ticker_report",
    "app.api.endpoints.watchlist",
    "app.rag.client",
    "app.skills.tier2.stock_valuation.skill",
    "app.orchestrator.core",
    "app.observability.langfuse_client",
]
ignore_errors = true
