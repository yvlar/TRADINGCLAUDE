name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Installer les dépendances
        run: pip install -r requirements-ci.txt

      - name: Lancer les tests backend (sans E2E ni evals)
        env:
          ANTHROPIC_API_KEY: sk-ant-ci-dummy-key
          DATABASE_URL: postgresql://unused:5432/unused
          REDIS_URL: redis://localhost:6379/0
          QDRANT_URL: http://localhost:6333
        run: pytest tests/ --ignore=tests/e2e --ignore=tests/evals -q --tb=short

  test-frontend:
    name: Frontend — Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests frontend
        run: npm test

  lint:
    name: Lint — ruff + ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer ruff
        run: pip install ruff

      - name: Lint Python (ruff)
        run: ruff check app/ tests/

      - name: Installer les dépendances frontend
        working-directory: frontend
        run: npm ci

      - name: Lint TypeScript (ESLint)
        working-directory: frontend
        run: npm run lint

  typecheck:
    name: Typecheck — mypy + tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances Python
        run: pip install -r requirements-ci.txt mypy

      - name: Typecheck Python (mypy)
        run: mypy app/ --ignore-missing-imports

      - name: Installer les dépendances frontend
        working-directory: frontend
        run: npm ci

      - name: Typecheck TypeScript (tsc)
        working-directory: frontend
        run: npm run typecheck
