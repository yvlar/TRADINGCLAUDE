name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]

permissions:
  contents: read

jobs:
  test-backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Installer les dépendances
        run: pip install -r requirements-ci.txt

      - name: Lancer les tests backend (sans E2E ni evals)
        env:
          ANTHROPIC_API_KEY: sk-ant-ci-dummy-key
          DATABASE_URL: postgresql://unused:5432/unused
          REDIS_URL: redis://localhost:6379/0
          QDRANT_URL: http://localhost:6333
        run: pytest tests/ --ignore=tests/e2e --ignore=tests/evals -q --tb=short

  test-frontend:
    name: Frontend — Vitest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests frontend
        run: npm test

  lint:
    name: Lint — ruff + ESLint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer ruff
        run: pip install ruff

      - name: Lint Python (ruff)
        run: ruff check app/ tests/

      - name: Installer les dépendances frontend
        working-directory: frontend
        run: npm ci

      - name: Lint TypeScript (ESLint)
        working-directory: frontend
        run: npm run lint

  typecheck:
    name: Typecheck — mypy + tsc
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances Python
        run: pip install -r requirements-ci.txt mypy

      - name: Typecheck Python (mypy)
        run: mypy app/ --ignore-missing-imports

      - name: Installer les dépendances frontend
        working-directory: frontend
        run: npm ci

      - name: Typecheck TypeScript (tsc)
        working-directory: frontend
        run: npm run typecheck

  security:
    name: Sécurité — pip-audit + bandit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les outils de sécurité
        run: pip install pip-audit bandit

      - name: Audit des dépendances déclarées (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Analyse statique sécurité (bandit)
        # B608 ignoré : tout le SQL dynamique n'interpole que des listes de colonnes
        # constantes (_SELECT_COLS/_ROW_COLUMNS) ; les données utilisateur passent
        # toujours par des placeholders asyncpg $n (cf. conventions-python.md).
        run: bandit -r app/ -ll --skip B608

  migrations:
    name: Migrations — Alembic + RLS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: copilote
          POSTGRES_PASSWORD: copilote
          POSTGRES_DB: copilote
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilote"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Installer les dépendances (CI) + Alembic
        run: pip install -r requirements-ci.txt "alembic>=1.13.0" "sqlalchemy[asyncio]>=2.0.0"

      - name: upgrade → downgrade → upgrade (idempotence)
        env:
          DATABASE_URL: postgresql://copilote:copilote@localhost:5432/copilote
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current

      # Prouve la RLS (E3-S5) dans le gate : la migration laisse le schéma à head ;
      # on crée un rôle NOSUPERUSER (un superuser contournerait la RLS) puis on exécute
      # la matrice d'isolation cross-tenant rouge→vert sur les 7 tables RLS contre ce rôle.
      - name: Créer un rôle NOSUPERUSER pour la preuve d'isolation
        run: |
          python - <<'PY'
          import asyncio, asyncpg
          async def main():
              c = await asyncpg.connect("postgresql://copilote:copilote@localhost:5432/copilote")
              await c.execute("DROP ROLE IF EXISTS rls_tester")
              await c.execute("CREATE ROLE rls_tester LOGIN NOSUPERUSER PASSWORD 'rls_tester'")
              await c.execute("GRANT USAGE ON SCHEMA public TO rls_tester")
              # Matrice E3-S5 : les 6 tables métier + tenants (parent FK) + usage_events
              # (7ᵉ table RLS, E4-S1). USAGE sur les séquences car esg_score_history/
              # alert_history sont BIGSERIAL (nextval).
              await c.execute(
                  "GRANT SELECT, INSERT, UPDATE, DELETE ON "
                  "analysis_history, watchlist, composite_score_history, "
                  "esg_score_history, alert_history, annotations, usage_events, tenants, "
                  "api_keys TO rls_tester"
              )
              # plan_limits : table de référence GLOBALE (hors RLS) lue par la purge de
              # rétention (RetentionService join tenants ⨝ plan_limits, E4-S6) — SELECT seul.
              await c.execute("GRANT SELECT ON plan_limits TO rls_tester")
              # subscriptions/stripe_events : tables de facturation HORS RLS (E4-S7) lues/
              # écrites par le webhook sous le tenant legacy — la preuve d'acceptation Stripe
              # (free→pro) les exerce via le rôle NOSUPERUSER.
              await c.execute(
                  "GRANT SELECT, INSERT, UPDATE, DELETE ON subscriptions, stripe_events "
                  "TO rls_tester"
              )
              await c.execute("GRANT USAGE ON ALL SEQUENCES IN SCHEMA public TO rls_tester")
              await c.close()
          asyncio.run(main())
          PY

      - name: Matrice isolation RLS 7 tables + threading tenant clé API + agrégation usage + purge rétention + webhook Stripe + rapport scopé tenant (rôle NOSUPERUSER)
        env:
          RLS_TEST_DATABASE_URL: postgresql://rls_tester:rls_tester@localhost:5432/copilote
        run: >-
          pytest tests/integration/test_rls_isolation.py
          tests/integration/test_api_key_tenant_integration.py
          tests/integration/test_usage_aggregate_rls.py
          tests/integration/test_retention_purge_rls.py
          tests/integration/test_stripe_billing_webhook.py
          tests/integration/test_report_tenant_rls.py
          tests/integration/test_watchlist_metering_rls.py
          -m integration -q --tb=short

  test-e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    # Suite navigateur : exécutée sur dev (et PR le ciblant). Démarre Vite :5173 ;
    # le harnais lance FastAPI en thread avec Claude/DB/Redis mockés.
    if: github.ref == 'refs/heads/dev' || github.base_ref == 'dev'
    permissions:
      contents: read
    env:
      E2E_TRACE: '1'   # trace Playwright sauvegardée sur échec (tests/e2e/.traces/)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances Python (dev + Playwright)
        run: pip install -r requirements-dev.txt

      - name: Installer le navigateur Chromium
        run: python -m playwright install --with-deps chromium

      - name: Installer les dépendances frontend
        working-directory: frontend
        run: npm ci

      - name: Construire le frontend (build de prod)
        working-directory: frontend
        run: npm run build

      - name: Démarrer Vite preview (:5173, assets pré-compilés)
        working-directory: frontend
        run: |
          npm run preview -- --port 5173 &
          npx --yes wait-on@8 http://localhost:5173 --timeout 60000

      - name: Lancer les tests E2E
        env:
          ANTHROPIC_API_KEY: sk-ant-ci-dummy-key
        run: pytest tests/e2e/ -m e2e -ra --tb=short

      - name: Archiver les traces Playwright (échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/e2e/.traces/
          if-no-files-found: ignore
          retention-days: 7
