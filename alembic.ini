# Configuration Alembic — socle de migrations versionnées (E2-S1).
# L'URL réelle est injectée depuis DATABASE_URL par alembic/env.py (jamais ici).
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# sqlalchemy.url est résolu dynamiquement dans env.py depuis l'environnement.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
